volumes:
  db_data_nest: # mount it internally instead of a folder. it avoids file lock problems

services:
  db-dev:
    container_name: db_nest_dev
    image: mariadb
    volumes:
      - db_data_nest:/var/lib/mysql
    restart: always
    ports:
      - '33065:3306'
    environment:
      MYSQL_ROOT_PASSWORD: admin321
      MYSQL_DATABASE: nest_db

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: node-backend-app
    restart: always
    depends_on:
      - db-dev
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    command: sh -c "npm install && npm run start"
    environment:
      - DB_HOST=db-dev
      - PORT=5000
      - EXPOSED_PORT=5050
      - HOST=http://localhost:5050
      - TYPEORM_CONNECTION=mysql
      - TYPEORM_HOST=db-dev
      - TYPEORM_USERNAME=root
      - TYPEORM_PASSWORD=admin321
      - TYPEORM_DATABASE=nest_db
      - TYPEORM_PORT=3306
      - TYPEORM_SYNCHRONIZE=false
      - TYPEORM_LOGGING=false
      - TYPEORM_ENTITIES=./src/entities/*.entity.ts
      - TYPEORM_MIGRATIONS=./src/migrations/*.ts
      - TYPEORM_ENTITIES_DIR=./src/entities/
      - TYPEORM_MIGRATIONS_DIR=./src/migrations/
      - TYPEORM_MIGRATIONS_RUN=false
      - TYPEORM_DROP_SCHEMA=false
    ports:
      - '5050:5000'
